# =============================================================================
# Isolated test-relay backing stack — GUI read-model overhaul harness (Dawn).
#
# A SEPARATE Compose project (`buzz-harness`) so the shared :3000 relay and the
# default `buzz-*` dev stack are never touched. No fixed container_names (they
# collide across projects) and alternate host ports. Mirrors Eva's evaperf-*
# isolation pattern.
#
#   Bring up:  docker compose -p buzz-harness -f docker-compose.harness.yml up -d
#   Ports:     postgres 5471 · redis 6471 · minio 9471/9472
#   Relay (run separately by scripts/start-isolated-test-relay.sh):
#              main 3030 · health 8088 · metrics 9202
# =============================================================================
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5471:5432"
    volumes:
      - harness-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6471:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    # Block's MinIO image, pinned by digest: MinIO RELEASE.2025-09-07T16-13-09Z
    # and mc RELEASE.2025-08-13T08-35-41Z from MinIO's checksummed GitHub
    # release files. MinIO's own Docker Hub images can no longer be pulled
    # (block/buzz#7880). Its entrypoint is `minio`. linux/amd64 only: on an
    # arm64 workstation it runs emulated, and the sampler records that.
    image: ghcr.io/block/buzz-minio@sha256:b8470bbeafbf57b20c86cf63804682b714bdcfdbb517f3770247e321e623f48f
    platform: linux/amd64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: buzz_dev_secret
    ports:
      - "9471:9000"
      - "9472:9001"
    volumes:
      - harness-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    # Same image; `mc` runs through the /bin/sh entrypoint override below.
    image: ghcr.io/block/buzz-minio@sha256:b8470bbeafbf57b20c86cf63804682b714bdcfdbb517f3770247e321e623f48f
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 buzz_dev buzz_dev_secret &&
        mc mb --ignore-existing local/buzz-media &&
        mc anonymous set none local/buzz-media
      "
    restart: "no"

volumes:
  harness-postgres-data:
  harness-minio-data:
